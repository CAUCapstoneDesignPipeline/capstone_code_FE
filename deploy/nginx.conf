worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 16m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    root CAPSTONE_STATIC_ROOT;
    location = /healthz { default_type application/json; return 200 '{"status":"UP"}'; }
    location ~ ^/(actuator|swagger-ui|v3/api-docs|internal|ai)(/|$|\.) { return 404; }
    location = /api/auth/dev/token { return 404; }
    location ~ ^/api(?:/|$) {
      set $backend http://be:8080;
      proxy_pass $backend$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Origin $http_origin;
      proxy_cache off;
      proxy_intercept_errors off;
      add_header Cache-Control "no-store" always;
    }
    location ~ /\. { return 404; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store" always; }
  }
}
