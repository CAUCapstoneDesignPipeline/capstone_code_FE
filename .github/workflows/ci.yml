name: FE CI
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_call: {}
permissions:
  contents: read
jobs:
  verify:
    name: FE verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24.21.0
        cache: npm
    - name: Tests and build
      run: |-
        npm ci
        npm run typecheck
        npm test
        npm run lint
        npm audit --omit=dev --audit-level=high
        npm run build
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Build Linux amd64 image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: capstone-ci:test
        build-args: SOURCE_REVISION=${{ github.sha }}
        provenance: false
    - name: Build disposable proxy test helper
      run: docker build --target build --platform linux/amd64 -t capstone-web-proxy-helper .
    - name: Image runtime checks
      run: python3 deploy/image-smoke.py
      env:
        PROXY_TEST_HELPER: capstone-web-proxy-helper
