name: Deploy FE image to GCP
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Reviewed operation (host compatibility checks still apply)
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      source_sha:
        description: Verified FE source commit (40 lowercase hex)
        type: string
        required: true
      image_digest:
        description: Verified web image digest (sha256 plus 64 lowercase hex)
        type: string
        required: true
      manifest_path:
        description: Reviewed deploy/gcp/releases/<releaseId>.json in pinned BE tools
        type: string
        required: true
      expected_release:
        description: Expected current release ID, or none for first release
        type: string
        required: true
      operation_id:
        description: Stable unique operation ID; reuse only with identical inputs
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'CAUCapstoneDesignPipeline/capstone_code_FE' && github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_ENABLED == 'true'
    uses: CAUCapstoneDesignPipeline/capstone_code_BE/.github/workflows/gcp-deploy-reusable.yml@c2aaad444fff4ac7e5688ea7b02d9210a6af1f16
    permissions:
      contents: read
      id-token: write
    with:
      operation: ${{ inputs.operation }}
      component: web
      source_sha: ${{ inputs.source_sha }}
      image_digest: ${{ inputs.image_digest }}
      manifest_path: ${{ inputs.manifest_path }}
      expected_release: ${{ inputs.expected_release }}
      operation_id: ${{ inputs.operation_id }}
      deploy_tool_sha: c2aaad444fff4ac7e5688ea7b02d9210a6af1f16
