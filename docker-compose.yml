# 로컬 개발용 DB. 서버와 앱은 각자 로컬에서 실행한다 (README 참고).
services:
  db:
    image: postgres:16
    container_name: capstone-db
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5432:5432"
    volumes:
      - capstone-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d capstone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  capstone-db:
